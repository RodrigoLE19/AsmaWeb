@if (mostrarNavbar()) {
    <nav class="navbar" aria-label="Navegación principal">
        <div class="navbar-container">
            <a href="/list-evaluation" class="logo">
                <img src="logo.png" alt="RespiraFacil">

                <span class="brand-name">
                    Respira <span>Fácil</span>
                </span>
            </a>

            <div class="nav-menu">
                <a 
                    routerLink="list-evaluation" 
                    routerLinkActive="active" 
                    ariaCurrentWhenActive="page"
                    class="nav-link"
                >
                    <span
                        class="material-symbols-outlined"
                        aria-hidden="true"
                    >
                        history
                    </span>
                    Evaluaciones
                </a>

                <a 
                    routerLink="new-evaluation" 
                    routerLinkActive="active"
                    ariaCurrentWhenActive="page" 
                    class="nav-link"
                >
                    <span 
                        class="material-symbols-outlined"
                        aria-hidden="true"
                    >
                        add_circle
                    </span>
                    Nueva evalaución
                </a>
            </div>

            <div class="user-section">
                <div class="user-info">
                    <samp class="user-name"> 
                        {{ obtenerNombreUsuario() }} 
                    </samp>

                    <button
                        type="button"
                        class="logout-button"
                        (click)="cerrarSesion()"
                    >
                        Cerrar sesión
                    </button>
                </div>
                
                 <div class="user-avatar" aria-hidden="true">
                    {{ obtenerInicialUsuario() }}
                 </div>
            </div>
         </div>

    </nav>

}
<router-outlet />
