<div
    class="modal-risk"
    [class.is-low]="matDialog.data.AsthmaDiagnosis === '[0]'"
    [class.is-high]="matDialog.data.AsthmaDiagnosis !== '[0]'"
>
    <div class="result-header">
        <span class="result-label">
            Resultado de tu evaluación
        </span>

        <div class="result-icon">
            <span
                class="material-symbols-outlined"
                aria-hidden="true"
            >
                pulmonology
            </span>
        </div>

        <h2 class="risk-title">
            {{ getRiskTitle() }}
        </h2>
    </div>

    <div class="result-body">
        <p class="result-message">
            {{ getMessageRisk() }}
        </p>

        <button
            type="button"
            class="result-button"
            (click)="modalService.closeModal('/list-evaluation')"
        >
            Aceptar

            <span
                class="material-symbols-outlined"
                aria-hidden="true"
            >arrow_forward</span>
        </button>
    </div>
</div>
