<div class="login-page">
    <div class="login-card">
        <div class="logo-container">
            <img src="logo.png" alt="Respira Facil" class="login-logo">
        </div>
        <div class="login-header">
            <h1>Bienvenido de nuevo</h1>
            <p>Inicia sesión para continuar con tu evaluación
                <br>
                de salud
            </p>
        </div>

        <form 
            class="login-form"
            [formGroup]="loginForm"
            (ngSubmit)="iniciarSesion()"
        >
            <div class="form-group">
                <label for="email">
                    Correo
                </label>
                <div class="input-container">
                    <samp class="input-icon">
                        ✉
                    </samp>
                    <input 
                        id="email" 
                        type="email" 
                        formControlName="email"
                        placeholder="nombre@gmail.con"
                    >
                </div>
            </div>

            <div class="form-group">
                <div class="password-label">
                    <label for="password">
                        Contraseña
                    </label>
                    <a href="#" class="forget-password">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
                <div class="input-container">
                    <span class="input-icon">
                        🔒
                    </span>
                    <input 
                        id="password" 
                        [type]="mostrarContrasena() ? 'text' : 'password'"
                        formControlName="contrasena"
                        placeholder="********"
                    >

                    <button 
                        type="button" 
                        class="show-password" 
                        (click)="toggleContrasena()"
                        aria-label="Mostrar contraseña"
                    >
                        {{ mostrarContrasena() ? '◉' : '◉' }} 
                    </button>
                </div>
            </div>

            
            @if (mensajeError()) {
                <div class="login-alert">
                    <span class="alert-icon">!</span>
                    <span>
                        {{ mensajeError() }}
                    </span>
                </div>
            }

            <button 
                type="submit" 
                class="login-button"
                [disabled]="isLoading()"
            >
                <span>
                    {{ isLoading() ? 'Ingresando...' : 'Iniciar Sesión' }}  
                </span>
                <span class="arrow">
                    →
                </span>
            </button>
        </form>

        <div class="separator">
            <div class="register-text">
                <span>¿No tienes una cuenta?</span>
                <a routerLink="/register">Crear una cuenta</a>
            </div>
        </div>
    </div>
</div>
@if (mensajeExito()) {
  <div class="success-overlay">
    <div class="success-notification">

      <div class="success-check">
        ✓
      </div>

      <h3>
        ¡Bienvenida, {{ nombreUsuario }}!
      </h3>

      <p>
        Inicio de sesión exitoso
      </p>

    </div>
  </div>
}
